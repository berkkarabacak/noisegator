name: Windows exe

on:
  push:
    branches: [main]
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build one-file exe
        run: pyinstaller --noconfirm NoiseGator.spec

      - name: Install Inno Setup
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) {
            $tmp = Join-Path $env:TEMP "innosetup-setup.exe"
            Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile $tmp
            Start-Process -FilePath $tmp -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          }

      - name: Compile installer
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "C:\ProgramData\chocolatey\bin\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after Inno Setup install" }
          & $iscc installer\NoiseGator.iss
          if (-not (Test-Path "installer-out\NoiseGator-Setup.exe")) {
            throw "installer-out\NoiseGator-Setup.exe was not produced"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoiseGator.exe
          path: app/dist/NoiseGator.exe
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoiseGator-Setup.exe
          path: installer-out/NoiseGator-Setup.exe
          if-no-files-found: error

      - name: Publish release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/dist/NoiseGator.exe
            installer-out/NoiseGator-Setup.exe
          generate_release_notes: true

      - name: Publish release (windows channel)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows
          name: Windows
          files: |
            app/dist/NoiseGator.exe
            installer-out/NoiseGator-Setup.exe
          generate_release_notes: false

      - name: Publish release (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.10
          name: NoiseGator Modern 0.10
          body: |
            Windows build of NoiseGator Modern 0.10.
            Portable NoiseGator.exe plus NoiseGator-Setup.exe (Start Menu / Desktop).
            dB gate with hysteresis, echo-back, and voice filter.
            First-run helps set up the official VB-CABLE virtual mic for Discord, Zoom, or Teams.
            The portable exe URL is unchanged.
          files: |
            app/dist/NoiseGator.exe
            installer-out/NoiseGator-Setup.exe
          generate_release_notes: false
